    :root {
      color-scheme: dark;
      --page: #0d1013;
      --text: #f2f3f4;
      --muted: #858b93;
      --line: #272d33;
      --field: #0a0d10;
      --button: #6b2025;
      --button-text: #8e7375;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; background: var(--page); }

    body {
      color: var(--text);
      font-family: "Space Grotesk", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .page {
      width: min(1020px, calc(100% - 48px));
      min-height: 100svh;
      margin: 0 auto;
      padding: 58px 0 34px;
      display: grid;
      grid-template-rows: auto minmax(330px, 1fr) auto;
    }

    .brand {
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .brand img {
      width: 66px;
      height: auto;
      display: block;
    }

    .brand strong {
      font-size: 18px;
      line-height: 1;
      letter-spacing: .17em;
      font-weight: 650;
    }

    .hero {
      align-self: center;
      text-align: center;
      padding-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 5.3vw, 78px);
      line-height: .98;
      letter-spacing: -.057em;
      font-weight: 650;
    }

    h1 span { display: block; }

    .lede {
      max-width: 520px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.42;
      letter-spacing: -.015em;
    }

    .entry {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      text-align: center;
    }

    form {
      width: min(820px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 12px;
    }

    input, button {
      height: 64px;
      border-radius: 9px;
    }

    input {
      min-width: 0;
      border: 1px solid #30363d;
      background: var(--field);
      color: var(--text);
      padding: 0 20px;
      font-size: 19px;
      outline: none;
    }

    input::placeholder { color: #5f656d; opacity: 1; }

    button {
      border: 1px solid #76252b;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 650;
    }

    .local, .signin, .about {
      margin: 14px 0 0;
      color: #697079;
      font-size: 14px;
      line-height: 1.35;
    }

    .signin { margin-top: 12px; color: #747a82; }
    .signin strong { color: var(--text); font-weight: 650; }

    .about {
      display: inline-block;
      margin-top: 22px;
      color: #747a82;
      text-decoration: underline;
      text-decoration-color: #343a40;
      text-underline-offset: 4px;
    }

    @media (max-width: 600px) {
      .page {
        width: 100%;
        min-height: 100svh;
        padding: 44px 20px 24px;
        grid-template-rows: auto minmax(330px, 1fr) auto;
      }

      .brand { gap: 5px; }
      .brand img { width: 62px; }
      .brand strong { font-size: 17px; }

      .hero {
        padding: 18px 0 46px;
      }

      h1 {
        font-size: 36px;
        line-height: 1.08;
        letter-spacing: -.052em;
      }

      .lede {
        max-width: 270px;
        margin-top: 20px;
        font-size: 19px;
        line-height: 1.52;
      }

      .entry { padding-top: 20px; }

      form {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      input, button { width: 100%; height: 64px; }
      input { font-size: 19px; }

      .local { max-width: 340px; margin: 13px auto 0; font-size: 13px; }
      .signin { margin-top: 13px; font-size: 14px; }
      .about { margin-top: 24px; font-size: 14px; }
    }

    @media (max-height: 700px) and (max-width: 600px) {
      .page { padding-top: 28px; grid-template-rows: auto minmax(245px, 1fr) auto; }
      .hero { padding-bottom: 22px; }
      .lede { font-size: 16px; line-height: 1.4; }
      input, button { height: 54px; }
    }
  </style>
</head>
